name: Release launcher APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the signed launcher APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # A debug key is generated fresh on every runner, so a release signed with it
            # cannot update the installed launcher - fail instead of publishing it.
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          # Every release must have a higher versionCode than the one before it; the run number always grows.
          code=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: launcher
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }}
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/tvhome.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: dist/tvhome.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tvhome.apk
          generate_release_notes: true
          # A tag with a pre-release suffix (1.2.0-rc1) is published as a pre-release, so
          # Obtainium's default stable track skips it.
          prerelease: ${{ contains(github.ref_name, '-') }}
